<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="d-flex justify-content-center mt-5">
      <select onchange="onCatClick(this.value)" id="selectRes" name=""></select>
    </div>
    <button onclick="displayData()">saved Products</button>

    <div class="row mt-4 mb-5" id="result"></div>
  </body>
  <script>
    let xmlObj = new XMLHttpRequest();

    xmlObj.open("get", "https://dummyjson.com/products");
    xmlObj.send();
    let apiResponse = [];
    xmlObj.onreadystatechange = () => {
      if (xmlObj.readyState == 4) {
        if (xmlObj.status == 200) {
          apiResponse = xmlObj.response;

          apiResponse = JSON.parse(apiResponse).apiResponse;
          console.log(apiResponse);
          // let allCategories = apiResponse.map((eachProduct)=>eachProduct.category)
          // console.log(allCategories)
          let allCategories = [];
          apiResponse.forEach((eachPro) => {
            if (!allCategories.includes(eachPro.category)) {
              allCategories.push(eachPro.category);
            }
          });
          console.log(allCategories);
          let selectResult = document.getElementById("selectRes");
          allCategories.map((eachCategory) => {
            selectResult.innerHTML += `<option value="${eachCategory}">${eachCategory}
          
        </option>`;
          });

          let resEl = document.getElementById("result");

          apiResponse.map(
            (eachProduct) =>
              (resEl.innerHTML += `<div class="col-3"><div class="card" style="width: 18rem;">
  <img src=${eachProduct?.thumbnail} class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">${eachProduct?.title}</h5>
    <p class="card-text">${eachProduct?.description}</p>
     <p class="card-text">$${eachProduct?.price}</p>
    <button onclick="onSaveClick(${eachProduct.id})"  class="btn btn-primary">Save</button>  </div>
</div></div>`),
          );
        }
      }
    };
    const onCatClick = (cat) => {
      console.log(cat);

      let filteredData = apiResponse.filter(
        (eachData) => eachData.category == cat,
      );
      console.log(filteredData);
      let resEl = document.getElementById("result");
      resEl.innerHTML = "";
      filteredData.map(
        (eachProduct) =>
          (resEl.innerHTML += `<div class="col-3"><div class="card" style="width: 18rem;">
  <img src=${eachProduct?.thumbnail} class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">${eachProduct?.title}</h5>
    <p class="card-text">${eachProduct?.description}</p>
     <p class="card-text">$${eachProduct?.price}</p>
    <button onclick="onSaveClick(${eachProduct.id})" class="btn btn-primary">Save</button>
  </div>
</div></div>`),
      );
    };

    const onSaveClick = (id) => {
      let savedItem = JSON.parse(localStorage.getItem("savedItem")) || [];

      let product = apiResponse.find((eachProduct) => eachProduct.id == id);

      let alreadySaved = savedItem.some((eachProduct) => eachProduct.id == id);

      if (!alreadySaved) {
        savedItem.unshift(product);
        localStorage.setItem("savedItem", JSON.stringify(savedItem));
      } else {
        alert("Product already saved!");
      }
    };

    const displayData = () => {
      let savedItem = JSON.parse(localStorage.getItem("savedItem")) || [];
      let result = document.querySelector("#result");
      result.innerHTML = "";
      savedItem.forEach((eachProduct) => {
        result.innerHTML += ` <div class="col-3 mb-4"> <div class="card" style="width: 18rem;"> <img src="${eachProduct.thumbnail}" class="card-img-top" alt="${eachProduct.title}" style="height:200px; object-fit:cover;" > <div class="card-body"> <h5 class="card-title"> ${eachProduct.title} </h5> <p class="card-text"> ${eachProduct.description} </p> <p> <strong>Price:</strong> $${eachProduct.price} </p> <p> <strong>Category:</strong> ${eachProduct.category} </p> <button onclick="editData(${eachProduct.id})" class="btn btn-warning me-2" > Edit </button> <button onclick="deleteData(${eachProduct.id})" class="btn btn-danger" > Delete </button> </div> </div> </div> `;
      });
    };
    const editData = (id) => {
      let savedItem = JSON.parse(localStorage.getItem("savedItem")) || [];
      let product = savedItem.find((eachProduct) => eachProduct.id == id);
      if (!product) return;
      let result = document.querySelector("#result");
      result.innerHTML = ` <div class="col-12"> <div class="card p-4"> <h3 class="mb-4"> Edit Product </h3> <div class="mb-3"> <label class="form-label"> Thumbnail Image URL </label> <input type="text" id="editThumbnail" class="form-control" value="${product.thumbnail}" > </div> <div class="mb-3"> <label class="form-label"> Product Title </label> <input type="text" id="editTitle" class="form-control" value="${product.title}" > </div> <div class="mb-3"> <label class="form-label"> Description </label> <textarea id="editDescription" class="form-control" rows="4" >${product.description}</textarea> </div> <div class="mb-3"> <label class="form-label"> Price </label> <input type="number" id="editPrice" class="form-control" value="${product.price}" > </div> <div class="mb-3"> <label class="form-label"> Category </label> <input type="text" id="editCategory" class="form-control" value="${product.category}" > </div> <button onclick="updateData(${product.id})" class="btn btn-success me-2" > Update Product </button> <button onclick="displayData()" class="btn btn-secondary" > Cancel </button> </div> </div> `;
    };
    const updateData = (id) => {
      let savedItem = JSON.parse(localStorage.getItem("savedItem")) || [];
      let productIndex = savedItem.findIndex(
        (eachProduct) => eachProduct.id == id,
      );
      if (productIndex === -1) return;
      savedItem[productIndex].thumbnail =
        document.querySelector("#editThumbnail").value;
      savedItem[productIndex].title =
        document.querySelector("#editTitle").value;
      savedItem[productIndex].description =
        document.querySelector("#editDescription").value;
      savedItem[productIndex].price = Number(
        document.querySelector("#editPrice").value,
      );
      savedItem[productIndex].category =
        document.querySelector("#editCategory").value;
      localStorage.setItem("savedItem", JSON.stringify(savedItem));
      displayData();
    };
    const deleteData = (id) => {
      let savedItem = JSON.parse(localStorage.getItem("savedItem")) || [];
      let newArray = savedItem.filter((eachProduct) => eachProduct.id != id);
      localStorage.setItem("savedItem", JSON.stringify(newArray));
      displayData();
    };
  </script>
</html>
