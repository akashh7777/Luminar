<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="d-flex justify-content-center mt-5">
      <select onchange="onCatClick(this.value)" id="selectRes" name="" >
        </select>
    </div>
    <div class="row mt-4 mb-5" id="result"></div>
  </body>
  <script>
    let xmlObj = new XMLHttpRequest();

    xmlObj.open("get", "https://dummyjson.com/products");
    xmlObj.send();
    let apiResponse=[]
    xmlObj.onreadystatechange = () => {
      if (xmlObj.readyState == 4) {
        if (xmlObj.status == 200) {
          apiResponse = xmlObj.response;

          apiResponse = JSON.parse(apiResponse).products;
          console.log(apiResponse);
          // let allCategories = apiResponse.map((eachProduct)=>eachProduct.category)
          // console.log(allCategories)
          let allCategories=[]
          apiResponse.forEach((eachPro)=>{
            if(!allCategories.includes(eachPro.category)){
              allCategories.push(eachPro.category)
            }
          })
          console.log(allCategories)
          let selectResult = document.getElementById('selectRes')
          allCategories.map((eachCategory)=>{
            selectResult.innerHTML +=`<option value="${eachCategory}">${eachCategory}
          
        </option>`
          })

          let resEl = document.getElementById("result");

          apiResponse.map(
            (eachProduct) =>
              (resEl.innerHTML += `<div class="col-3"><div class="card" style="width: 18rem;">
  <img src=${eachProduct?.thumbnail} class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">${eachProduct?.title}</h5>
    <p class="card-text">${eachProduct?.description}</p>
    <a href="#" class="btn btn-primary">Go somewhere</a>
  </div>
</div></div>`),
          );
        }
      }
    };
    const onCatClick=(cat)=>{
      console.log(cat)
    }
  </script>
</html>
