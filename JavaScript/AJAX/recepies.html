<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="row mt-5 mb-5" id="result">
      
    </div>
  </body>
  <script>
    let xmlObj=new XMLHttpRequest()
    xmlObj.open('get','https://dummyjson.com/recipes')
    xmlObj.send()
    xmlObj.onreadystatechange=()=>{
        if(xmlObj.readyState==4){
            if(xmlObj.status==200){
                let apiResponse=xmlObj.response

                apiResponse=JSON.parse(apiResponse).recipes
                console.log(apiResponse)
                let resEl=document.getElementById('result')
                apiResponse.map((eachRecipe)=>(
                    resEl.innerHTML+=`<div class='col-3'><div class="card" style="width: 18rem">
        <img src="${eachRecipe?.image}" class="card-img-top" alt="..." />
        <div class="card-body">
          <h5 class="card-title">${eachRecipe?.name}</h5>
          <p class="card-text">
            ${eachRecipe?.instructions}
          </p>
          <a href="#" class="btn btn-primary">Go somewhere</a>
        </div>
      </div></div>`
                ))
            }
        }
    }
  </script>
</html>
