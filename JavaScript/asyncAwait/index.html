<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <title>Async Await</title>

  <style>
    body {
      background: #eef2f7;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .container {
      max-width: 100%;
    }

    .page-title {
      color: #111827;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .text-muted {
      color: #6b7280 !important;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    input {
      padding: 8px;
      width: 250px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    button {
      padding: 8px 15px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #333;
    }

    .table-card {
      border: none;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
    }

    .todo-table {
      border-collapse: collapse;
      width: 100%;
    }

    .todo-table thead th {
      background: #4f46e5;
      color: #ffffff;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .todo-table tbody tr {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      transition: background 0.2s ease;
    }

    .todo-table tbody tr:hover {
      background: #f8faff;
    }

    .todo-table tbody td {
      padding: 18px 20px;
      border: none;
      vertical-align: middle;
    }

    .id-badge {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 50%;
      font-weight: 700;
      font-size: 14px;
    }

    .todo-text {
      font-weight: 500;
      color: #374151;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.completed {
      background: #dcfce7;
      color: #15803d;
    }

    .status.pending {
      background: #fee2e2;
      color: #dc2626;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .user-id {
      display: inline-block;
      padding: 6px 10px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #4b5563;
      font-weight: 600;
      font-size: 13px;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 13px;
      margin-right: 5px;
    }

    .edit-btn {
      background: #f59e0b;
    }

    .edit-btn:hover {
      background: #d97706;
    }

    .delete-btn {
      background: #dc2626;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 26px;
      }

      .todo-table thead th,
      .todo-table tbody td {
        padding: 14px;
      }

      .todo-text {
        font-size: 14px;
      }

      .search-box {
        flex-wrap: wrap;
      }

      input {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <!-- Page Header -->
    <div class="mb-4">
      <h2 class="fw-bold mb-1 page-title">Todos</h2>
      <p class="text-muted mb-0">
        User todos and completion details
      </p>
    </div>

    <!-- Search -->
    <div class="search-box">

      <input
        id="searchInp"
        placeholder="Search todo..."
        type="text"
      />

      <button onclick="onSearchClick()">
        Search
      </button>

      <button onclick="apiFetch()">
        Reset
      </button>

    </div>

    <!-- Table Card -->
    <div class="card table-card shadow-sm">

      <div class="card-body p-0">

        <div class="table-responsive">

          <table class="table todo-table mb-0">

            <!-- Table Header -->
            <thead>
              <tr>
                <th>ID</th>
                <th>Todo</th>
                <th>Status</th>
                <th>User ID</th>
                <th>Actions</th>
              </tr>
            </thead>

            <!-- API Data -->
            <tbody id="tableBody"></tbody>

          </table>

        </div>

      </div>

    </div>

  </div>


  <script>

    // Store API data
    let data = [];

    // Get table body
    let tableBody = document.getElementById("tableBody");


    // ==========================================
    // FETCH API
    // ==========================================

    const apiFetch = async () => {

      try {

        let apiResult = await fetch(
          "https://dummyjson.com/todos"
        );

        data = await apiResult.json();

        console.log(data);

        displayTodos(data.todos);

      } catch (error) {

        console.log(error);

      }

    };


    // ==========================================
    // DISPLAY TODOS
    // ==========================================

    const displayTodos = (todos) => {

      tableBody.innerHTML = "";

      todos.map((eachTodo) => {

        tableBody.innerHTML += `

          <tr>

            <!-- ID -->
            <td>
              <span class="id-badge">
                ${eachTodo.id}
              </span>
            </td>


            <!-- TODO -->
            <td>
              <span class="todo-text">
                ${eachTodo.todo}
              </span>
            </td>


            <!-- STATUS -->
            <td>

              ${
                eachTodo.completed

                  ? `

                    <span class="status completed">

                      <span class="status-dot"></span>

                      Completed

                    </span>

                  `

                  : `

                    <span class="status pending">

                      <span class="status-dot"></span>

                      Pending

                    </span>

                  `
              }

            </td>


            <!-- USER ID -->
            <td>

              <span class="user-id">

                User #${eachTodo.userId}

              </span>

            </td>


            <!-- ACTIONS -->
            <td>

              <button
                class="action-btn edit-btn"
                onclick="editTodo(${eachTodo.id})"
              >
                Edit
              </button>


              <button
                class="action-btn delete-btn"
                onclick="deleteTodo(${eachTodo.id})"
              >
                Delete
              </button>

            </td>

          </tr>

        `;

      });

    };


    // ==========================================
    // SEARCH
    // ==========================================

    const onSearchClick = () => {

      let searchInput =
        document
          .getElementById("searchInp")
          .value
          .toLowerCase();


      let newData = data.todos.filter(
        (eachTodo) =>

          eachTodo.todo
            .toLowerCase()
            .includes(searchInput)
      );


      console.log(newData);


      displayTodos(newData);

    };


    // ==========================================
    // DELETE
    // ==========================================

    const deleteTodo = (id) => {

      let confirmDelete =
        confirm(
          "Are you sure you want to delete this todo?"
        );


      if (!confirmDelete) {
        return;
      }


      // Remove todo from local data
      data.todos = data.todos.filter(
        (eachTodo) =>
          eachTodo.id !== id
      );


      // Display updated data
      displayTodos(data.todos);

    };


    // ==========================================
    // EDIT
    // ==========================================

    const editTodo = (id) => {

      // Find todo using ID
      let todo = data.todos.find(
        (eachTodo) =>
          eachTodo.id === id
      );


      // Ask user for new todo
      let newTodo =
        prompt(
          "Edit Todo",
          todo.todo
        );


      // Cancel button
      if (newTodo === null) {
        return;
      }


      // Empty value
      if (newTodo.trim() === "") {

        alert(
          "Todo cannot be empty"
        );

        return;

      }


      // Update todo
      todo.todo = newTodo;


      // Display updated data
      displayTodos(data.todos);

    };


    // ==========================================
    // INITIAL API CALL
    // ==========================================

    apiFetch();

  </script>

</body>

</html>
