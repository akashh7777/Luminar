<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Await</title>
    <style>
      body {
        background: #f4f6f9;
        font-family: Arial, sans-serif;
      }
      .container {
        width: 100%;
        max-width: 100%;
        padding-left: 20px;
        padding-right: 20px;
      }

      /* Page Header */
      .page-title {
        color: #212529;
      }

      /* Table Card */
      .table-card {
        width: 100%;
        border: none;
        border-radius: 18px;
        overflow: hidden;
        background: white;
      }

      /* Table */
      .todo-table {
        border-collapse: separate;
        border-spacing: 0 8px;
        padding: 0 12px;
        width: 100%;
      }

      /* Table Header */
      .todo-table thead th {
        background: #212529;
        color: white;
        padding: 18px;
        font-size: 14px;
        font-weight: 600;
        border: none;
      }

      .todo-table thead th:first-child {
        border-radius: 10px 0 0 10px;
      }

      .todo-table thead th:last-child {
        border-radius: 0 10px 10px 0;
      }

      /* Table Rows */
      .todo-table tbody tr {
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
      }

      .todo-table tbody tr:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      }

      .todo-table tbody td {
        padding: 17px 18px;
        border: none;
        vertical-align: middle;
      }

      .todo-table tbody tr td:first-child {
        border-radius: 10px 0 0 10px;
      }

      .todo-table tbody tr td:last-child {
        border-radius: 0 10px 10px 0;
      }

      /* ID Badge */
      .id-badge {
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #eef2ff;
        color: #4f46e5;
        border-radius: 10px;
        font-weight: 700;
      }

      /* Todo Text */
      .todo-text {
        font-weight: 500;
        color: #343a40;
      }

      /* Status */
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
      }

      /* Completed */
      .status.completed {
        background: #d1fae5;
        color: #047857;
      }

      /* Pending */
      .status.pending {
        background: #fff3cd;
        color: #997404;
      }

      /* Status Dot */
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      /* User ID */
      .user-id {
        display: inline-block;
        padding: 7px 11px;
        background: #f1f3f5;
        border-radius: 8px;
        color: #495057;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <!-- Page Header -->
      <div class="mb-4">
        <h2 class="fw-bold mb-1 page-title">Todos</h2>
        <p class="text-muted mb-0">User todos and completion details</p>
      </div>

      <!-- Table Card -->
      <div class="card table-card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table todo-table mb-0">
              <!-- Table Header -->
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Todo</th>
                  <th>Status</th>
                  <th>User ID</th>
                </tr>
              </thead>

              <!-- API Data -->
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    const apiFetch = async () => {
      let apiResult = await fetch("https://dummyjson.com/todos");
      let data = await apiResult.json();
      console.log(data);
      let tableBody = document.getElementById("tableBody");

      data.todos.map(
        (eachTodo) =>
          (tableBody.innerHTML += `
                <tr>
                  <td>
                    <span class="id-badge">
                      ${eachTodo?.id}
                    </span>
                  </td>

                  <td>
                    <span class="todo-text">
                      ${eachTodo?.todo}
                    </span>
                  </td>

                  <td>
                    ${
                      eachTodo?.completed
                        ? `
                          <span class="status completed">
                            <span class="status-dot"></span>
                            Completed
                          </span>
                        `
                        : `
                          <span class="status pending">
                            <span class="status-dot"></span>
                            Pending
                          </span>
                        `
                    }
                  </td>

                  <td>
                    <span class="user-id">
                      User #${eachTodo?.userId}
                    </span>
                  </td>
                </tr>
              `),
      );
    };

    apiFetch();
  </script>
</html>
