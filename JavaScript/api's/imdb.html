<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CineVault </title>
  <link rel="shortcut icon" href="https://favicon.im/imdb.com?larger=true" type="image/x-icon">


  <style>

    /* =========================
       GLOBAL
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #8b5cf6;
      --secondary: #38bdf8;
      --background: #070914;
      --card: rgba(255, 255, 255, 0.045);
      --border: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --muted: #9ca3af;
    }

    body {

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 10% 10%,
          rgba(139, 92, 246, 0.15),
          transparent 28%
        ),

        radial-gradient(
          circle at 90% 20%,
          rgba(56, 189, 248, 0.12),
          transparent 28%
        ),

        var(--background);

      color: var(--text);

      min-height: 100vh;
    }


    /* =========================
       HEADER
    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(7, 9, 20, 0.82);

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid var(--border);

      padding:
        18px 6%;
    }


    .navbar {

      max-width: 1250px;

      margin: auto;

      display: flex;

      align-items: center;

      gap: 30px;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      font-size: 24px;

      font-weight: 800;

      letter-spacing: -0.5px;

      padding:
        8px 13px;

      border-radius: 10px;

      color: white;

      background:

        linear-gradient(
          135deg,
          var(--primary),
          #6366f1
        );

      box-shadow:

        0 0 25px
        rgba(139, 92, 246, 0.3);
    }


    /* =========================
       SEARCH
    ========================= */

    .search {

      flex: 1;

      max-width: 620px;

      margin: auto;

      display: flex;
    }


    .search input {

      width: 100%;

      padding:
        13px 18px;

      border:
        1px solid var(--border);

      border-right:
        none;

      outline: none;

      background:
        rgba(255,255,255,0.055);

      color: white;

      font-size: 14px;

      border-radius:
        10px 0 0 10px;
    }


    .search input::placeholder {
      color: #687080;
    }


    .search button {

      border: none;

      padding:
        0 23px;

      color: white;

      font-weight: 700;

      cursor: pointer;

      background:

        linear-gradient(
          135deg,
          var(--primary),
          #6366f1
        );

      border-radius:
        0 10px 10px 0;

      transition: 0.3s;
    }


    .search button:hover {

      box-shadow:

        0 0 20px
        rgba(139,92,246,0.4);

      transform:
        translateX(1px);
    }


    .nav-text {

      color: #8b93a5;

      font-size: 13px;

      white-space: nowrap;
    }


    /* =========================
       MAIN
    ========================= */

    .container {

      width: 90%;

      max-width: 1250px;

      margin:
        55px auto;
    }


    /* =========================
       TITLE
    ========================= */

    .movie-title {

      margin-bottom: 30px;
    }


    .movie-title h1 {

      font-size:
        clamp(38px, 5vw, 60px);

      font-weight: 800;

      letter-spacing: -2px;

      margin-bottom: 12px;

      background:

        linear-gradient(
          90deg,
          #ffffff,
          #c4b5fd,
          #7dd3fc
        );
      background-clip: text;
      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;
    }


    .movie-meta {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 10px;

      color: var(--muted);

      font-size: 14px;
    }


    .dot {

      color:
        var(--secondary);
    }


    .badge {

      border:
        1px solid rgba(139,92,246,0.4);

      padding:
        4px 9px;

      border-radius: 5px;

      color: #c4b5fd;

      background:
        rgba(139,92,246,0.08);
    }


    /* =========================
       MOVIE CARD
    ========================= */

    .movie-card {

      position: relative;

      display: grid;

      grid-template-columns:
        280px 1fr;

      gap: 40px;

      padding: 30px;

      border-radius: 24px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.025)
        );

      border:
        1px solid var(--border);

      box-shadow:

        0 25px 70px
        rgba(0,0,0,0.45);

      overflow: hidden;
    }


    .movie-card::before {

      content: "";

      position: absolute;

      width: 350px;

      height: 350px;

      background:
        var(--primary);

      filter:
        blur(150px);

      opacity: 0.12;

      top: -200px;

      right: -100px;
    }


    .movie-card::after {

      content: "";

      position: absolute;

      width: 250px;

      height: 250px;

      background:
        var(--secondary);

      filter:
        blur(140px);

      opacity: 0.06;

      bottom: -180px;

      left: 20%;
    }


    /* =========================
       POSTER
    ========================= */

    .poster {

      position: relative;

      z-index: 1;
    }


    .poster img {

      width: 100%;

      display: block;

      border-radius: 16px;

      box-shadow:

        0 25px 45px
        rgba(0,0,0,0.65);

      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;
    }


    .poster img:hover {

      transform:
        scale(1.025);

      box-shadow:

        0 30px 55px
        rgba(0,0,0,0.8);
    }


    /* =========================
       DETAILS
    ========================= */

    .details {

      position: relative;

      z-index: 1;

      display: flex;

      flex-direction: column;

      gap: 25px;
    }


    /* =========================
       RATINGS
    ========================= */

    .ratings {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 35px;

      padding-bottom: 23px;

      border-bottom:
        1px solid var(--border);
    }


    .rating {

      display: flex;

      align-items: center;

      gap: 12px;
    }


    .star {

      font-size: 35px;

      color:
        var(--secondary);

      filter:

        drop-shadow(
          0 0 10px
          rgba(56,189,248,0.4)
        );
    }


    .rating-number {

      font-size: 25px;

      font-weight: 800;
    }


    .rating-label {

      font-size: 12px;

      color: #70788a;

      margin-top: 3px;
    }


    .divider {

      width: 1px;

      height: 45px;

      background:
        #303442;
    }


    .score {

      width: 45px;

      height: 45px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 10px;

      background:

        linear-gradient(
          135deg,
          #8b5cf6,
          #6366f1
        );

      font-size: 16px;

      font-weight: 800;

      box-shadow:

        0 5px 20px
        rgba(139,92,246,0.25);
    }


    /* =========================
       INFORMATION
    ========================= */

    .info-grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        17px 35px;
    }


    .info-item {

      display: flex;

      gap: 12px;

      align-items: flex-start;

      font-size: 14px;
    }


    .info-item strong {

      min-width: 85px;

      color:
        var(--secondary);

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 0.7px;
    }


    .info-item span {

      color: #d1d5db;

      line-height: 1.5;
    }


    /* =========================
       SECTION
    ========================= */

    .section-title {

      font-size: 18px;

      font-weight: 700;

      margin-bottom: 13px;
    }


    /* =========================
       GENRE
    ========================= */

    .genre-list {

      display: flex;

      flex-wrap: wrap;

      gap: 9px;
    }


    .genre {

      padding:
        7px 14px;

      border-radius: 30px;

      color: #c4b5fd;

      background:
        rgba(139,92,246,0.07);

      border:
        1px solid rgba(139,92,246,0.2);

      font-size: 13px;

      transition: 0.3s;
    }


    .genre:hover {

      background:
        var(--primary);

      color: white;

      border-color:
        var(--primary);

      transform:
        translateY(-2px);
    }


    /* =========================
       PLOT
    ========================= */

    .plot {

      color: #9ca3af;

      line-height: 1.8;

      font-size: 15px;

      max-width: 850px;
    }


    /* =========================
       CREDITS
    ========================= */

    .credits {

      margin-top: 25px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }


    .credit {

      padding: 20px;

      border-radius: 16px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      transition: 0.3s;
    }


    .credit:hover {

      transform:
        translateY(-4px);

      border-color:
        rgba(139,92,246,0.3);

      box-shadow:
        0 15px 30px
        rgba(0,0,0,0.2);
    }


    .credit-label {

      color: #697386;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 1px;

      margin-bottom: 8px;
    }


    .credit-name {

      color: white;

      font-size: 15px;

      line-height: 1.5;
    }


    /* =========================
       BOTTOM CARDS
    ========================= */

    .bottom-grid {

      margin-top: 45px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }


    .card {

      min-height: 150px;

      padding: 24px;

      border-radius: 17px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.055),
          rgba(255,255,255,0.02)
        );

      border:
        1px solid var(--border);

      transition: 0.3s;
    }


    .card:hover {

      transform:
        translateY(-5px);

      border-color:
        rgba(56,189,248,0.25);

      box-shadow:

        0 15px 35px
        rgba(0,0,0,0.3);
    }


    .card-icon {

      font-size: 24px;

      margin-bottom: 12px;
    }


    .card h3 {

      color:
        #c4b5fd;

      font-size: 16px;

      margin-bottom: 10px;
    }


    .card p {

      color: #8c95a6;

      line-height: 1.65;

      font-size: 13px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      margin-top: 70px;

      padding: 30px;

      text-align: center;

      border-top:
        1px solid var(--border);

      color: #4b5563;

      font-size: 13px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 950px) {

      .movie-card {

        grid-template-columns:
          220px 1fr;
      }

      .bottom-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 750px) {

      .navbar {

        flex-wrap: wrap;
      }

      .search {

        order: 3;

        flex-basis: 100%;
      }

      .nav-text {

        display: none;
      }

      .movie-card {

        grid-template-columns: 1fr;
      }

      .poster {

        max-width: 270px;

        margin: auto;
      }

      .info-grid {

        grid-template-columns: 1fr;
      }

      .credits {

        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 500px) {

      .container {

        width: 92%;

        margin-top: 35px;
      }

      .movie-card {

        padding: 20px;

        border-radius: 18px;
      }

      .bottom-grid {

        grid-template-columns: 1fr;
      }

      .ratings {

        gap: 20px;
      }

      .divider {

        display: none;
      }

    }

  </style>

</head>





  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="navbar">

      <div class="logo">
        CineVault
      </div>


      <div class="search">

        <input id="userInput"
          type="text"
          placeholder="Search movies, actors, directors..."
        >

        <button onclick="fetchData()">
          Search
        </button>

      </div>


      <div class="nav-text">
        Explore Movies
      </div>

    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  


    <div class="container" id="result" ></div>



  



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    CineVault • Discover Your Next Movie

  </footer>


</body>
<script>
  const fetchData = async()=>{
try {
  let inputVal = document.getElementById('userInput').value
  let apiResponse = await fetch(`http://www.omdbapi.com/?t=${inputVal}&apikey=90f8c4b7`)
  let apiData = await apiResponse.json()
  console.log(apiData)
  let resultElement = document.getElementById('result')
  resultElement.innerHTML=`

    <div class="movie-title">

      <h1>
        ${apiData?.Title}
      </h1>


      <div class="movie-meta">

        <span>
          ${apiData?.Year}
        </span>

        <span class="dot">
          •
        </span>

        <span class="badge">
          ${apiData?.Rated}
        </span>

        <span class="dot">
          •
        </span>

        <span>
          ${apiData?.Released}
        </span>

        <span class="dot">
          •
        </span>

        <span>
          ${apiData?.Runtime}
        </span>

      </div>

    </div>



    <!-- =========================
         MOVIE CARD
    ========================== -->

    <div class="movie-card">


      <!-- POSTER -->

      <div class="poster">

        <img
          src="${apiData?.Poster}"
          alt="${apiData?.Title} Movie Poster"
        >

      </div>



      <!-- DETAILS -->

      <div class="details">


        <!-- RATINGS -->

        <div class="ratings">


          <div class="rating">

            <div class="star">
              ★
            </div>

            <div>

              <div class="rating-number">
                ${apiData?.imdbRating}/10
              </div>

              <div class="rating-label">
                IMDb Rating
              </div>

            </div>

          </div>


          <div class="divider"></div>


          <div class="rating">

            <div class="score">
               ${apiData?.Metascore}
            </div>

            <div>

              <div class="rating-number">
                Metascore
              </div>

              <div class="rating-label">
                Critic Reviews
              </div>

            </div>

          </div>


        </div>



        <!-- INFORMATION -->

        <div class="info-grid">


          <div class="info-item">

            <strong>
              Year
            </strong>

            <span>
               ${apiData?.Year}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Rated
            </strong>

            <span>
              ${apiData?.Rated}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Released
            </strong>

            <span>
              ${apiData?.Released}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Runtime
            </strong>

            <span>
              ${apiData?.Runtime}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Language
            </strong>

            <span>
              ${apiData?.Language}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Type
            </strong>

            <span>
              ${apiData?.Type}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Box Office
            </strong>

            <span>
              ${apiData?.BoxOffice}
            </span>

          </div>


          <div class="info-item">

            <strong>
              Awards
            </strong>

            <span>
              ${apiData?.Awards}
            </span>

          </div>


        </div>



        <!-- GENRE -->

        <div>

          <div class="section-title">
            Genre
          </div>


          <div class="genre-list">

            ${apiData?.Genre
              ? apiData.Genre.split(",").map(genre => `
                  <span class="genre">
                    ${genre.trim()}
                  </span>
                `).join("")
              : "<span class='genre'>N/A</span>"
            }

          </div>

        </div>



        <!-- PLOT -->

        <div>

          <div class="section-title">
            Plot
          </div>


          <p class="plot">
            ${apiData?.Plot || "N/A"}
          </p>

        </div>


      </div>

    </div>



    <!-- =========================
         CREDITS
    ========================== -->

    <div class="credits">


      <div class="credit">

        <div class="credit-label">
          Director
        </div>

        <div class="credit-name">
          ${apiData?.Director || "N/A"}
        </div>

      </div>


      <div class="credit">

        <div class="credit-label">
          Writer
        </div>

        <div class="credit-name">
          ${apiData?.Writer || "N/A"}
        </div>

      </div>


      <div class="credit">

        <div class="credit-label">
          Actors
        </div>

        <div class="credit-name">

          ${apiData?.Actors || "N/A"}

        </div>

      </div>


    </div>



    <!-- =========================
         EXTRA INFORMATION
    ========================== -->

    <div class="bottom-grid">


      <div class="card">

        <div class="card-icon">
          🏆
        </div>

        <h3>
          Awards
        </h3>

        <p>
          ${apiData?.Awards || "N/A"}
        </p>

      </div>


      <div class="card">

        <div class="card-icon">
          ⭐
        </div>

        <h3>
          Ratings
        </h3>

        <p>

          IMDb Rating: ${apiData?.imdbRating || "N/A"}/10
          <br>

          Metascore: ${apiData?.Metascore || "N/A"}

        </p>

      </div>


      <div class="card">

        <div class="card-icon">
          💰
        </div>

        <h3>
          Box Office
        </h3>

        <p>
          ${apiData?.BoxOffice || "N/A"}
        </p>

      </div>


      <div class="card">

        <div class="card-icon">
          🎬
        </div>

        <h3>
          Movie Type
        </h3>

        <p>

          ${apiData?.Type || "N/A"}
          <br>

          Runtime: ${apiData?.Runtime || "N/A"}

        </p>

      </div>


    </div>`
} catch (error) {
  console.log(error)
  alert("Something Went Wrong While Fetching Data")
  
}
  }  
</script>
</html>
